aid: dayjob
name: Dayjob
description: Dayjob is an AI-powered scheduling agent built for waste management and skip hire fleets,
  operated by Gaea Technology Ltd and backed by Y Combinator (Spring 2026). Its autonomous agents analyze
  millions of potential route combinations to build optimized daily schedules that factor in travel times,
  skip sizes, driver availability and priority job assignments, then continuously re-optimize in real time
  as new jobs, driver changes and exceptions arrive. Dayjob integrates with existing ERP and telematics
  systems (Weighsoft, PurGo, Wastelogics, plus custom report setups) and claims customers see revenue and
  efficiency gains, tighter time-window hit rates and materially less planning admin. It is a vertical
  logistics application rather than an API platform - no public developer portal, API reference or SDKs
  are published at this time. This profile has been enriched from the company's public website.
